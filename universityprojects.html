<head>

    <title>Meowearily portfolio</title>

</head>

<style>
    .modeling-section {
      background-color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background-color: #000;
      display: flex;
      width: 100%;
      flex-direction: column;
      align-items: center;
      text-transform: uppercase;
      justify-content: center;
      padding: 13px 70px;
      font: 400 30px Bebas Neue, sans-serif;
    }
    .header-content {
      display: flex;
      width: 100%;
      max-width: 1203px;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .nav-group {
      display: flex;
      gap: 40px 100px;
      color: #fff;
    }
    .logo {
      aspect-ratio: 1.1;
      object-fit: contain;
      object-position: center;
      width: 63px;
      align-self: start;
    }
    .back-link-wrapper {
      display: flex;
      flex-direction: column;
    }
    .back-link {
      background-color: #000;
      padding: 12px 14px;
    }
    .message-btn-wrapper {
      display: flex;
      flex-direction: column;
      color: #000;
      margin: auto 0;
    }
    .message-btn {
      border-radius: 5px;
      background-color: #fff;
      padding: 5px 70px;
    }
    
    .gallery-section {
      align-self: center;
      margin-top: 69px;
      width: 100%;
      max-width: 1200px;
    }
    .gallery-grid {
      gap: 20px;
      display: flex;
    }
    .gallery-left {
      display: flex;
      flex-direction: column;
      line-height: normal;
      width: 41%;
      margin-left: 0;
    }
    .gallery-image {
      aspect-ratio: 0.6;
      object-fit: contain;
      object-position: center;
      width: 100%;
      border-radius: 20px;
      flex-grow: 1;
    }
    .gallery-right {
      display: flex;
      flex-direction: column;
      line-height: normal;
      width: 59%;
      margin-left: 20px;
    }
    .preview-container {
      display: flex;
      flex-grow: 1;
      flex-direction: column;
      color: #fff;
      font: 400 33px Abel, sans-serif;
    }
    .preview-image {
      aspect-ratio: 1.36;
      object-fit: contain;
      object-position: center;
      width: 100%;
      border-radius: 20px;
    }
    .preview-text {
      border-radius: 20px;
      background-color: #000000;
      margin-top: 23px;
      padding: 128px 250px 101px;
      align-self: center;
    }
    
    @media (max-width: 991px) {
      .header {
        max-width: 100%;
        padding: 0 20px;
      }
      .header-content {
        max-width: 100%;
      }
      .nav-group {
        max-width: 100%;
      }
      .back-link {
        padding-right: 20px;
      }
      .message-btn {
        padding: 0 20px;
      }
      .title {
        max-width: 100%;
        font-size: 40px;
      }
      .gallery-section {
        max-width: 100%;
        margin-top: 40px;
      }
      .gallery-grid {
        flex-direction: column;
        align-items: stretch;
        gap: 0;
      }
      .gallery-left {
        width: 100%;
      }
      .gallery-image {
        max-width: 100%;
        margin-top: 20px;
      }
      .gallery-right {
        width: 100%;
      }
      .preview-container {
        max-width: 100%;
        margin-top: 20px;
      }
      .preview-image {
        max-width: 100%;
      }
      .preview-text {
        max-width: 100%;
        padding: 100px 20px 110px;
      }
      .footer {
        max-width: 100%;
        margin-top: 40px;
        padding: 0 20px;
      }
      .footer-content {
        max-width: 100%;
      }
    }
  </style>

<body>
    <div class="modeling-section">

                            <li class="btn"><a href="index.html#Contacts">SEND MESSAGE</a></li>
                        </ul>
                    </nav>  
            </header>
        </div>
        
        <h2 style="margin-top: 5%;">3D Modeling</h2>
        
        <section class="gallery-section">
          <div >
            <img src="images/TOP.png" alt="There is the compose of Twenty One Pilots song lyric">
            <img src="images/fenec.png" alt="There is the pictures of fennec">
            <img src="images/bookcover.png" alt="There is the bookcover of The Apothecary diaries">
            <img src="images/bookcover2.png" alt="There is the bookcover of The Hitchhiker's Guide to the Galaxy">
            <img src="images/cotton.png" alt="There is the pictures of cotton">
            <img src="images/fallenangel.png" alt="There is the Fallen Angel combine with letters">
            <img src="images/windraising.png" alt="There is the poster of anime The Wind has rising">
            <img src="images/teamo.png" alt="There is the latin quote about love">

          </div>
        </section>
        
        <footer class="footer">
          <div class="footer-content">
            <nav class="nav-links">
              <img src="images/logob.png" alt="Meowearily logo, click if you want to go to the main page">
              <span class="nav-text">main page</span>
              <img src="images/arrow.png" alt="Arrow from main page to university projects">
              <span class="nav-text">university projects</span>

            <div class="social-links">
              <img src="images/gmail.png" alt="Gmail logo, click if you want to write me">

      </div>
</body>
</html>
